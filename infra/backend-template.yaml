AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bedrock Model Profiler - Step Functions Workflow

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  ScheduleEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable daily scheduled execution

  CloudFrontDistributionArn:
    Type: String
    Default: ''
    Description: ARN of the CloudFront distribution that needs access to the data bucket (optional)

  ExistingDataBucket:
    Type: String
    Default: ''
    Description: Name of existing S3 bucket to use (leave empty to create new bucket)

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: Log level for Lambda functions

  # Configuration parameters for Lambda functions
  AvailabilityMaxWorkers:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 50
    Description: Max parallel workers for regional availability checks

  AvailabilityRegionTimeout:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 120
    Description: Timeout in seconds for each region availability check

  QuotaBatchSize:
    Type: Number
    Default: 100
    MinValue: 10
    MaxValue: 1000
    Description: Batch size for quota collection API calls

  PricingMaxBatches:
    Type: Number
    Default: 100
    MinValue: 10
    MaxValue: 1000
    Description: Maximum number of batches for pricing API calls

  PricingApiTimeout:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 300
    Description: Timeout in seconds for pricing API calls

  PricingThrottleDelay:
    Type: String
    Default: '0.5'
    Description: Delay in seconds between pricing API calls to avoid throttling

  PricingRetryDelay:
    Type: String
    Default: '2'
    Description: Delay in seconds before retrying failed pricing API calls

  AwsConnectTimeout:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 60
    Description: Connection timeout in seconds for AWS API calls

  AwsReadTimeout:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 120
    Description: Read timeout in seconds for AWS API calls

  AwsMaxRetries:
    Type: Number
    Default: 3
    MinValue: 0
    MaxValue: 10
    Description: Maximum number of retries for AWS API calls

  CognitoRegion:
    Type: String
    Default: us-east-1
    Description: AWS region for Cognito User Pool

  Ec2Region:
    Type: String
    Default: us-east-1
    Description: AWS region for EC2 API calls (region discovery)

Conditions:
  HasCloudFrontAccess: !Not [!Equals [!Ref CloudFrontDistributionArn, '']]
  ScheduleEnabledCondition: !Equals [!Ref ScheduleEnabled, 'true']
  CreateNewBucket: !Equals [!Ref ExistingDataBucket, '']

Globals:
  Function:
    Runtime: python3.11
    Timeout: 60
    MemorySize: 256
    Layers:
      - !Ref SharedUtilsLayer
      - !Sub arn:aws:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPythonV3-python311-x86_64:7
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DATA_BUCKET: !If [CreateNewBucket, !Ref DataBucket, !Ref ExistingDataBucket]
        LOG_LEVEL: !Ref LogLevel
        POWERTOOLS_SERVICE_NAME: bedrock-profiler
        POWERTOOLS_LOG_LEVEL: !Ref LogLevel
        POWERTOOLS_METRICS_NAMESPACE: BedrockProfiler
        # AWS client configuration
        AWS_CONNECT_TIMEOUT: !Ref AwsConnectTimeout
        AWS_READ_TIMEOUT: !Ref AwsReadTimeout
        AWS_MAX_RETRIES: !Ref AwsMaxRetries
        # Cognito configuration
        COGNITO_REGION: !Ref CognitoRegion
        # EC2 configuration (for region discovery)
        EC2_REGION: !Ref Ec2Region

Resources:
  #############################################
  # Shared Lambda Layer
  #############################################
  SharedUtilsLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'bedrock-profiler-shared-utils-${Environment}'
      Description: Shared utilities for Bedrock Model Profiler Lambda functions - v2.6.0 Efficiency optimizations with full region caching and TTL-based external data caching
      ContentUri: ../backend/layers/common/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Delete

  #############################################
  # S3 Bucket for Data Storage
  #############################################
  DataBucket:
    Type: AWS::S3::Bucket
    Condition: CreateNewBucket
    Properties:
      BucketName: !Sub 'bedrock-profiler-data-${AWS::AccountId}-${Environment}'
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldExecutions
            Status: Enabled
            Prefix: executions/
            ExpirationInDays: 30
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Bucket policy to allow CloudFront OAC access (only if CloudFront ARN is provided AND creating new bucket)
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: HasCloudFrontAccess
    Properties:
      Bucket: !If [CreateNewBucket, !Ref DataBucket, !Ref ExistingDataBucket]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub
              - '${BucketArn}/latest/*'
              - BucketArn: !If [CreateNewBucket, !GetAtt DataBucket.Arn, !Sub 'arn:aws:s3:::${ExistingDataBucket}']
            Condition:
              StringEquals:
                AWS:SourceArn: !Ref CloudFrontDistributionArn

  #############################################
  # Lambda Functions
  #############################################

  # Wave 1: Pricing Collection
  PricingCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-pricing-collector-${Environment}'
      CodeUri: ../backend/lambdas/pricing-collector/
      Handler: handler.lambda_handler
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          PRICING_API_REGION: us-east-1
          PRICING_MAX_BATCHES: !Ref PricingMaxBatches
          PRICING_API_TIMEOUT: !Ref PricingApiTimeout
          PRICING_THROTTLE_DELAY: !Ref PricingThrottleDelay
          PRICING_RETRY_DELAY: !Ref PricingRetryDelay
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - pricing:GetProducts
                - pricing:DescribeServices
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  PricingAggregatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-pricing-aggregator-${Environment}'
      CodeUri: ../backend/lambdas/pricing-aggregator/
      Handler: handler.lambda_handler
      Timeout: 120
      MemorySize: 1024
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  # Wave 1: Model Extraction
  ModelExtractorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-model-extractor-${Environment}'
      CodeUri: ../backend/lambdas/model-extractor/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:ListFoundationModels
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  ModelMergerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-model-merger-${Environment}'
      CodeUri: ../backend/lambdas/model-merger/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  # Wave 1: Quota Collection
  QuotaCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-quota-collector-${Environment}'
      CodeUri: ../backend/lambdas/quota-collector/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          QUOTA_BATCH_SIZE: !Ref QuotaBatchSize
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - servicequotas:ListServiceQuotas
                - servicequotas:GetServiceQuota
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  # Wave 2: Enrichment
  PricingLinkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-pricing-linker-${Environment}'
      CodeUri: ../backend/lambdas/pricing-linker/
      Handler: handler.lambda_handler
      Timeout: 120
      MemorySize: 1024
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  RegionalAvailabilityFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-regional-availability-${Environment}'
      CodeUri: ../backend/lambdas/regional-availability/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 512
      Environment:
        Variables:
          AVAILABILITY_MAX_WORKERS: !Ref AvailabilityMaxWorkers
          AVAILABILITY_REGION_TIMEOUT: !Ref AvailabilityRegionTimeout
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:ListFoundationModels
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  FeatureCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-feature-collector-${Environment}'
      CodeUri: ../backend/lambdas/feature-collector/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:ListInferenceProfiles
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  RegionDiscoveryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-region-discovery-${Environment}'
      CodeUri: ../backend/lambdas/region-discovery/
      Handler: handler.lambda_handler
      Timeout: 120
      MemorySize: 256
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeRegions
              Resource: '*'
            - Effect: Allow
              Action:
                - bedrock:ListInferenceProfiles
              Resource: '*'

  TokenSpecsCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-token-specs-collector-${Environment}'
      CodeUri: ../backend/lambdas/token-specs-collector/
      Handler: handler.lambda_handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  # Wave 2: Mantle Collection
  MantleCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-mantle-collector-${Environment}'
      CodeUri: ../backend/lambdas/mantle-collector/
      Handler: handler.lambda_handler
      Timeout: 120
      MemorySize: 256
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock-mantle:*
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  # Wave 2: Lifecycle Collection
  LifecycleCollectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-lifecycle-collector-${Environment}'
      CodeUri: ../backend/lambdas/lifecycle-collector/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  # Final Aggregation
  FinalAggregatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-final-aggregator-${Environment}'
      CodeUri: ../backend/lambdas/final-aggregator/
      Handler: handler.lambda_handler
      Timeout: 180
      MemorySize: 2048
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  CopyToLatestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-copy-to-latest-${Environment}'
      CodeUri: ../backend/lambdas/copy-to-latest/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:CopyObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  # Gap Detection - Analyzes pipeline output for data gaps
  GapDetectionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-gap-detection-${Environment}'
      CodeUri: ../backend/lambdas/gap-detection/
      Handler: handler.lambda_handler
      Timeout: 120
      MemorySize: 512
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'

  # Self-Healing Agent - Uses Bedrock Claude to suggest config updates
  SelfHealingAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-self-healing-agent-${Environment}'
      CodeUri: ../backend/lambdas/self-healing-agent/
      Handler: handler.lambda_handler
      Timeout: 300
      MemorySize: 1024
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !If
                - CreateNewBucket
                - !Sub '${DataBucket.Arn}/*'
                - !Sub 'arn:aws:s3:::${ExistingDataBucket}/*'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource:
                # Cross-region inference profiles can route to any US region
                - !Sub 'arn:aws:bedrock:*::foundation-model/anthropic.claude-*'
                - !Sub 'arn:aws:bedrock:*::foundation-model/us.anthropic.claude-*'
                - !Sub 'arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/us.anthropic.claude-*'

  # Config Sync Lambda - Syncs frontend config from backend profiler-config.json
  ConfigSyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'bedrock-profiler-config-sync-${Environment}'
      CodeUri: ../backend/lambdas/config-sync/
      Handler: handler.lambda_handler
      Timeout: 60
      MemorySize: 256
      Policies:
        - S3CrudPolicy:
            BucketName: !If [CreateNewBucket, !Ref DataBucket, !Ref ExistingDataBucket]

  #############################################
  # Step Functions State Machine
  #############################################
  StateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bedrock-profiler-sfn-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambdaFunctions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !GetAtt PricingCollectorFunction.Arn
                  - !GetAtt PricingAggregatorFunction.Arn
                  - !GetAtt ModelExtractorFunction.Arn
                  - !GetAtt ModelMergerFunction.Arn
                  - !GetAtt QuotaCollectorFunction.Arn
                  - !GetAtt PricingLinkerFunction.Arn
                  - !GetAtt RegionalAvailabilityFunction.Arn
                  - !GetAtt FeatureCollectorFunction.Arn
                  - !GetAtt RegionDiscoveryFunction.Arn
                  - !GetAtt TokenSpecsCollectorFunction.Arn
                  - !GetAtt FinalAggregatorFunction.Arn
                  - !GetAtt CopyToLatestFunction.Arn
                  - !GetAtt GapDetectionFunction.Arn
                  - !GetAtt SelfHealingAgentFunction.Arn
                  - !GetAtt MantleCollectorFunction.Arn
                  - !GetAtt LifecycleCollectorFunction.Arn
                  - !GetAtt ConfigSyncFunction.Arn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogDelivery
                  - logs:GetLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutResourcePolicy
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogGroups
                Resource: '*'

  StateMachineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/stepfunctions/bedrock-profiler-${Environment}'
      RetentionInDays: 30

  BedrockProfilerStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub 'bedrock-profiler-workflow-${Environment}'
      DefinitionUri: ../backend/statemachine/bedrock-profiler.asl.json
      DefinitionSubstitutions:
        S3Bucket: !If [CreateNewBucket, !Ref DataBucket, !Ref ExistingDataBucket]
        PricingCollectorFunction: !GetAtt PricingCollectorFunction.Arn
        PricingAggregatorFunction: !GetAtt PricingAggregatorFunction.Arn
        ModelExtractorFunction: !GetAtt ModelExtractorFunction.Arn
        ModelMergerFunction: !GetAtt ModelMergerFunction.Arn
        QuotaCollectorFunction: !GetAtt QuotaCollectorFunction.Arn
        PricingLinkerFunction: !GetAtt PricingLinkerFunction.Arn
        RegionalAvailabilityFunction: !GetAtt RegionalAvailabilityFunction.Arn
        FeatureCollectorFunction: !GetAtt FeatureCollectorFunction.Arn
        RegionDiscoveryFunction: !GetAtt RegionDiscoveryFunction.Arn
        TokenSpecsCollectorFunction: !GetAtt TokenSpecsCollectorFunction.Arn
        FinalAggregatorFunction: !GetAtt FinalAggregatorFunction.Arn
        CopyToLatestFunction: !GetAtt CopyToLatestFunction.Arn
        GapDetectionFunction: !GetAtt GapDetectionFunction.Arn
        SelfHealingAgentFunction: !GetAtt SelfHealingAgentFunction.Arn
        MantleCollectorFunction: !GetAtt MantleCollectorFunction.Arn
        LifecycleCollectorFunction: !GetAtt LifecycleCollectorFunction.Arn
        ConfigSyncFunction: !GetAtt ConfigSyncFunction.Arn
      Role: !GetAtt StateMachineRole.Arn
      Logging:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt StateMachineLogGroup.Arn
        Level: ALL
        IncludeExecutionData: true
      Tracing:
        Enabled: true

  #############################################
  # EventBridge Schedule (Daily Trigger)
  #############################################
  DailyScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bedrock-profiler-schedule-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StartStateMachine
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - states:StartExecution
                Resource: !Ref BedrockProfilerStateMachine

  DailySchedule:
    Type: AWS::Scheduler::Schedule
    Condition: ScheduleEnabledCondition
    Properties:
      Name: !Sub 'bedrock-profiler-daily-${Environment}'
      Description: 'Daily execution of Bedrock Model Profiler workflow'
      ScheduleExpression: 'cron(0 6 * * ? *)'  # 6 AM UTC daily
      ScheduleExpressionTimezone: 'UTC'
      FlexibleTimeWindow:
        Mode: 'FLEXIBLE'
        MaximumWindowInMinutes: 30
      Target:
        Arn: !Ref BedrockProfilerStateMachine
        RoleArn: !GetAtt DailyScheduleRole.Arn
        Input: '{}'
      State: ENABLED

Outputs:
  StateMachineArn:
    Description: ARN of the Step Functions state machine
    Value: !Ref BedrockProfilerStateMachine
    Export:
      Name: !Sub '${AWS::StackName}-StateMachineArn'

  DataBucketName:
    Description: Name of the S3 data bucket
    Value: !If [CreateNewBucket, !Ref DataBucket, !Ref ExistingDataBucket]
    Export:
      Name: !Sub '${AWS::StackName}-DataBucketName'

  DataBucketArn:
    Description: ARN of the S3 data bucket
    Value: !If
      - CreateNewBucket
      - !GetAtt DataBucket.Arn
      - !Sub 'arn:aws:s3:::${ExistingDataBucket}'
    Export:
      Name: !Sub '${AWS::StackName}-DataBucketArn'

  LatestModelsUrl:
    Description: S3 URL for latest models JSON
    Value: !Sub
      - 's3://${BucketName}/latest/bedrock_models.json'
      - BucketName: !If [CreateNewBucket, !Ref DataBucket, !Ref ExistingDataBucket]

  LatestPricingUrl:
    Description: S3 URL for latest pricing JSON
    Value: !Sub
      - 's3://${BucketName}/latest/bedrock_pricing.json'
      - BucketName: !If [CreateNewBucket, !Ref DataBucket, !Ref ExistingDataBucket]

  # Configuration outputs
  LogLevel:
    Description: Configured log level
    Value: !Ref LogLevel

  AvailabilityMaxWorkers:
    Description: Max workers for availability checks
    Value: !Ref AvailabilityMaxWorkers

  QuotaBatchSize:
    Description: Batch size for quota collection
    Value: !Ref QuotaBatchSize

  PricingMaxBatches:
    Description: Max batches for pricing collection
    Value: !Ref PricingMaxBatches
