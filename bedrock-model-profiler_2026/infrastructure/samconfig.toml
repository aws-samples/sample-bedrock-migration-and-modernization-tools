# SAM CLI configuration for Bedrock Model Profiler Frontend

version = 0.1

[default.deploy.parameters]
stack_name = "bedrock-profiler-frontend-dev"
resolve_s3 = true
s3_prefix = "bedrock-profiler-frontend-dev"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=\"dev\""
confirm_changeset = true

[dev.deploy.parameters]
stack_name = "bedrock-profiler-frontend-dev"
resolve_s3 = true
s3_prefix = "bedrock-profiler-frontend-dev"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=\"dev\""
confirm_changeset = true

[staging.deploy.parameters]
stack_name = "bedrock-profiler-frontend-staging"
resolve_s3 = true
s3_prefix = "bedrock-profiler-frontend-staging"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=\"staging\""
confirm_changeset = true

[prod.deploy.parameters]
stack_name = "bedrock-profiler-frontend-prod"
resolve_s3 = true
s3_prefix = "bedrock-profiler-frontend-prod"
region = "us-east-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "Environment=\"prod\""
confirm_changeset = true
